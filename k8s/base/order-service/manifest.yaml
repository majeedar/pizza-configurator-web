apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
data:
  SPRING_PROFILES_ACTIVE: "kubernetes"
  JAVA_TOOL_OPTIONS: "-Xmx160m -XX:MaxMetaspaceSize=128m"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/order_db"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  CLIENTS_RULE_SERVICE_BASE_URL: "http://rule-service:8082"
  CLIENTS_PRICING_SERVICE_BASE_URL: "http://pricing-service:8083"
  CLIENTS_CATALOG_SERVICE_BASE_URL: "http://catalog-service:8081"
---
# Placeholder only — replace with real credentials via `kubectl create secret` or a
# secrets manager before applying to any real cluster; never commit real values here.
apiVersion: v1
kind: Secret
metadata:
  name: order-service-db-credentials
type: Opaque
stringData:
  DB_USERNAME: postgres
  DB_PASSWORD: changeme
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: ghcr.io/majeedar/order-service:feb5cdbf354573f92b3da1b324a75a390cde34f7
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: order-service-config
            - secretRef:
                name: order-service-db-credentials
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
    - port: 8085
      targetPort: 8085
