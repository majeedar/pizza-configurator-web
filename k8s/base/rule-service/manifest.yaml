apiVersion: v1
kind: ConfigMap
metadata:
  name: rule-service-config
data:
  SPRING_PROFILES_ACTIVE: "kubernetes"
  JAVA_TOOL_OPTIONS: "-Xmx128m -XX:MaxMetaspaceSize=128m"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/rules_db"
  CLIENTS_CATALOG_SERVICE_BASE_URL: "http://catalog-service:8081"
  CLIENTS_PRICING_SERVICE_BASE_URL: "http://pricing-service:8083"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rule-service
  labels:
    app: rule-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rule-service
  template:
    metadata:
      labels:
        app: rule-service
    spec:
      containers:
        - name: rule-service
          image: ghcr.io/majeedar/rule-service:feb5cdbf354573f92b3da1b324a75a390cde34f7
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: rule-service-config
            - secretRef:
                name: rule-service-db-credentials
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rule-service
spec:
  selector:
    app: rule-service
  ports:
    - port: 8082
      targetPort: 8082
