apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
data:
  SPRING_PROFILES_ACTIVE: "kubernetes"
  JAVA_TOOL_OPTIONS: "-Xmx128m -XX:MaxMetaspaceSize=128m"
  CLIENTS_CATALOG_SERVICE_BASE_URL: "http://catalog-service:8081"
  CLIENTS_PRICING_SERVICE_BASE_URL: "http://pricing-service:8083"
  CLIENTS_RULE_SERVICE_BASE_URL: "http://rule-service:8082"
  CLIENTS_ORDER_SERVICE_BASE_URL: "http://order-service:8085"
  CLIENTS_AI_PARSER_SERVICE_BASE_URL: "http://ai-parser-service:8084"
  CLIENTS_KITCHEN_SERVICE_BASE_URL: "http://kitchen-service:8086"
  CLIENTS_ADMIN_SERVICE_BASE_URL: "http://admin-service:8087"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/majeedar/gateway:60a21ace9e248043bdef62096aba1f5c6583293d
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: gateway-config
            - secretRef:
                name: gateway-jwt-secret
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
