apiVersion: v1
kind: ConfigMap
metadata:
  name: pricing-service-config
data:
  SPRING_PROFILES_ACTIVE: "kubernetes"
  JAVA_TOOL_OPTIONS: "-Xmx128m -XX:MaxMetaspaceSize=128m"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/price_db"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-service
  labels:
    app: pricing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pricing-service
  template:
    metadata:
      labels:
        app: pricing-service
    spec:
      containers:
        - name: pricing-service
          image: ghcr.io/majeedar/pricing-service:feb5cdbf354573f92b3da1b324a75a390cde34f7
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: pricing-service-config
            - secretRef:
                name: pricing-service-db-credentials
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pricing-service
spec:
  selector:
    app: pricing-service
  ports:
    - port: 8083
      targetPort: 8083
