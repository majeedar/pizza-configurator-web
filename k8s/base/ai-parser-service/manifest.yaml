apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-parser-service-config
data:
  SPRING_PROFILES_ACTIVE: "kubernetes"
  JAVA_TOOL_OPTIONS: "-Xmx128m -XX:MaxMetaspaceSize=128m"
  OPENAI_BASE_URL: "https://api.deepseek.com"
  OPENAI_MODEL: "deepseek-chat"
---
# Placeholder only — replace with a real OpenAI API key via `kubectl create secret` or a
# secrets manager before applying to any real cluster; never commit a real key here.
apiVersion: v1
kind: Secret
metadata:
  name: ai-parser-service-openai-credentials
type: Opaque
stringData:
  OPENAI_API_KEY: changeme
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-parser-service
  labels:
    app: ai-parser-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-parser-service
  template:
    metadata:
      labels:
        app: ai-parser-service
    spec:
      containers:
        - name: ai-parser-service
          image: ghcr.io/majeedar/ai-parser-service:latest
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: ai-parser-service-config
            - secretRef:
                name: ai-parser-service-openai-credentials
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-parser-service
spec:
  selector:
    app: ai-parser-service
  ports:
    - port: 8084
      targetPort: 8084
