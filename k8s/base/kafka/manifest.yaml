# Single-broker KRaft-mode Kafka, mirroring docker-compose.yml's local setup.
# KAFKA_HEAP_OPTS caps JVM heap to fit this node's constrained memory budget.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka:9093"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx192m -Xms192m"
            # None of our topics are compacted; the log cleaner's default 128MB
            # dedupe buffer alone would blow the heap budget above for no benefit.
            - name: KAFKA_LOG_CLEANER_ENABLE
              value: "false"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            # kafka-broker-api-versions.sh launches a whole extra JVM per check, which
            # under this node's CPU contention routinely exceeds even a 10s timeout.
            # A TCP check is cheap and doesn't add to the contention it's measuring.
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 384Mi
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  # Headless: a single-node StatefulSet's broker connects to its own controller
  # listener via this Service name, which hits Kubernetes' pod-can't-reach-its-
  # own-ClusterIP hairpin-NAT issue on a normal (non-headless) Service. Headless
  # resolves straight to the pod IP instead, sidestepping it entirely.
  clusterIP: None
  # Headless services only publish DNS records for ready pods by default, but this
  # broker needs to resolve its own hostname to become ready in the first place —
  # without this it's a chicken-and-egg UnknownHostException loop.
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
