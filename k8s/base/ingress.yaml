# The gateway Service is the only externally exposed *API* entry point (CLAUDE.md §12) —
# every other backend service is ClusterIP-only and reachable exclusively from inside the
# cluster. The frontend static SPA is also exposed here, since a browser needs somewhere
# to load the app from before it can make any authenticated API calls.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pizza-configurator-ingress
spec:
  # ingressClassName is deliberately unset here — each overlay (local/hetzner/production)
  # patches in the controller it actually has (e.g. traefik on the Hetzner overlay).
  rules:
    - http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
