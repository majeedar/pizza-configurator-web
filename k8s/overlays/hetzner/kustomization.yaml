apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pizza-configurator-hetzner
resources:
  - ../../base

# Deployed to a single shared box (not the 2-node CX22 pair CLAUDE.md §13 assumed),
# already running several other live projects — real free memory is much tighter
# than the node's reported allocatable. Requests are trimmed hard below what a
# dedicated box would use; JVM heaps are capped to match via each service's
# JAVA_TOOL_OPTIONS. Postgres/Kafka/Redis run as StatefulSets in k8s/base with
# their own conservative sizing, not the blanket Deployment patch below.
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 50m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 192Mi
      # CPU limit is generous on purpose: unlike memory, CPU is compressible and
      # doesn't need to fit within real available headroom the same way. A tight
      # limit here throttled JVM cold starts badly enough (12+ services starting
      # at once on 4 real cores) that liveness probes killed pods mid-startup.
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 1000m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 288Mi
      # Same cold-start contention: give liveness/readiness a lot more patience
      # than a lightly-loaded dedicated box would need.
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/initialDelaySeconds
        value: 90
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/periodSeconds
        value: 15
      - op: add
        path: /spec/template/spec/containers/0/livenessProbe/failureThreshold
        value: 6
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/initialDelaySeconds
        value: 30
      - op: add
        path: /spec/template/spec/containers/0/readinessProbe/failureThreshold
        value: 10
  # order-service is the heaviest of the 9 (JPA/Hibernate, Flyway, bcrypt) — a bit
  # more headroom than the blanket patch above gives the rest.
  - target:
      kind: Deployment
      name: order-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 224Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 320Mi
  - target:
      kind: Ingress
      name: pizza-configurator-ingress
    patch: |-
      - op: add
        path: /spec/ingressClassName
        value: traefik
