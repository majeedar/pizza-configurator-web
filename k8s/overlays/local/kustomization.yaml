apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pizza-configurator-local
resources:
  - ../../base

patches:
  # Low resource requests for a local kind/k3s cluster — everything at 1 replica.
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 50m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 128Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 250m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
  - target:
      kind: Ingress
      name: pizza-configurator-ingress
    patch: |-
      - op: add
        path: /spec/ingressClassName
        value: nginx
