services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - gateway

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      CLIENTS_CATALOG_SERVICE_BASE_URL: http://catalog-service:8081
      CLIENTS_PRICING_SERVICE_BASE_URL: http://pricing-service:8083
      CLIENTS_RULE_SERVICE_BASE_URL: http://rule-service:8082
      CLIENTS_ORDER_SERVICE_BASE_URL: http://order-service:8085
      CLIENTS_AI_PARSER_SERVICE_BASE_URL: http://ai-parser-service:8084
      CLIENTS_KITCHEN_SERVICE_BASE_URL: http://kitchen-service:8086
      CLIENTS_ADMIN_SERVICE_BASE_URL: http://admin-service:8087
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:-this-is-a-development-only-placeholder-signing-secret-please-rotate}
    depends_on:
      - catalog-service
      - pricing-service
      - rule-service
      - order-service
      - ai-parser-service
      - kitchen-service
      - admin-service

  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CATALOG_IMAGES_DIR: /data/pizza-images
    volumes:
      - pizza-images:/data/pizza-images
    depends_on:
      postgres:
        condition: service_healthy

  pricing-service:
    build:
      context: .
      dockerfile: pricing-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/price_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy

  rule-service:
    build:
      context: .
      dockerfile: rule-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rules_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CLIENTS_CATALOG_SERVICE_BASE_URL: http://catalog-service:8081
      CLIENTS_PRICING_SERVICE_BASE_URL: http://pricing-service:8083
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      catalog-service:
        condition: service_started
      pricing-service:
        condition: service_started
      kafka:
        condition: service_healthy

  ai-parser-service:
    build:
      context: .
      dockerfile: ai-parser-service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in your shell or a .env file}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLIENTS_RULE_SERVICE_BASE_URL: http://rule-service:8082
      CLIENTS_PRICING_SERVICE_BASE_URL: http://pricing-service:8083
      CLIENTS_CATALOG_SERVICE_BASE_URL: http://catalog-service:8081
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  kitchen-service:
    build:
      context: .
      dockerfile: kitchen-service/Dockerfile
    # No host port published: kitchen-service can now run >1 replica (Redis-backed
    # board), and the gateway is the only intended external entry point anyway.
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "8088:8088"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  admin-service:
    build:
      context: .
      dockerfile: admin-service/Dockerfile
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/admin_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CLIENTS_PRICING_SERVICE_BASE_URL: http://pricing-service:8083
      CLIENTS_RULE_SERVICE_BASE_URL: http://rule-service:8082
      CLIENTS_ORDER_SERVICE_BASE_URL: http://order-service:8085
    depends_on:
      postgres:
        condition: service_healthy
      pricing-service:
        condition: service_started
      rule-service:
        condition: service_started

volumes:
  postgres-data:
  pizza-images:
