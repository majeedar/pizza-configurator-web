name: ai-parser-service

# No common-contracts path trigger here, unlike the other 7 workflows — ai-parser-service
# is stateless and doesn't depend on common-contracts, so it's excluded to avoid
# rebuilding it on changes it can't be affected by.
on:
  push:
    branches: [main]
    paths:
      - 'ai-parser-service/**'
  pull_request:
    paths:
      - 'ai-parser-service/**'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Test
        run: mvn -pl ai-parser-service -am test

      - name: Package
        run: mvn -pl ai-parser-service -am package -DskipTests

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        run: |
          docker build -f ai-parser-service/Dockerfile -t "$REGISTRY"/ai-parser-service:${{ github.sha }} .
          docker push "$REGISTRY"/ai-parser-service:${{ github.sha }}

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > ~/.kube/config

      - name: Deploy (rolling update)
        run: kubectl set image deployment/ai-parser-service ai-parser-service="$REGISTRY"/ai-parser-service:${{ github.sha }}
