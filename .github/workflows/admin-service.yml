name: admin-service

on:
  push:
    branches: [main]
    paths:
      - 'admin-service/**'
      - 'common-contracts/**'
  pull_request:
    paths:
      - 'admin-service/**'
      - 'common-contracts/**'

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Test
        run: mvn -pl admin-service -am test

      - name: Package
        run: mvn -pl admin-service -am package -DskipTests

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        run: |
          docker build -f admin-service/Dockerfile -t "$REGISTRY"/admin-service:${{ github.sha }} .
          docker push "$REGISTRY"/admin-service:${{ github.sha }}

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > ~/.kube/config

      - name: Deploy (rolling update)
        run: kubectl set image deployment/admin-service admin-service="$REGISTRY"/admin-service:${{ github.sha }}
