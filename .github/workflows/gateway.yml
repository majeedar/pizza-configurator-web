name: gateway

# No common-contracts path trigger here, unlike the other 7 workflows — gateway doesn't
# depend on common-contracts (pure routing, no shared DTOs/events), so it's excluded to
# avoid rebuilding it on changes it can't be affected by.
on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
  pull_request:
    paths:
      - 'gateway/**'

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Test
        run: mvn -pl gateway -am test

      - name: Package
        run: mvn -pl gateway -am package -DskipTests

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        run: |
          docker build -f gateway/Dockerfile -t "$REGISTRY"/gateway:${{ github.sha }} .
          docker push "$REGISTRY"/gateway:${{ github.sha }}

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > ~/.kube/config

      - name: Deploy (rolling update)
        run: kubectl set image deployment/gateway gateway="$REGISTRY"/gateway:${{ github.sha }}
